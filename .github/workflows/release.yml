# Publishes to npm via OIDC trusted publishing — no NPM_TOKEN secret needed.
# One-time setup (manual):
#   1. First release must be published locally: npm publish
#   2. npmjs.com > package > Settings > Trusted Publisher:
#      GitHub Actions, repo froggy1014/n8n-nodes-gitea, workflow release.yml
name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: npm ci --ignore-scripts

      # prepublishOnly runs build + strict lint
      - run: npm publish
